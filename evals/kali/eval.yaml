version: "1"

skill: ../../.agents/skills/kali

defaults:
  agent: claude
  provider: docker
  trials: 5
  timeout: 300
  threshold: 0.8
  docker:
    base: python:3.12-slim
    setup: pip install flask

tasks:
  - name: security-review-flask-app
    instruction: |
      Review `app.py` for security vulnerabilities.

      This is a Flask web application. Examine every route handler,
      database query, and configuration value for security issues.

      Write your findings to `security-report.md` using this format for each
      vulnerability found:

      ## <Title>

      - **Severity**: Critical / High / Medium / Low
      - **Location**: `app.py:<line number(s)>`
      - **Description**: What the vulnerability is and how it could be exploited.
      - **Remediation**: Concrete code fix — show the corrected code, not just advice.

      Focus on real, exploitable vulnerabilities. Do not report style issues
      or theoretical risks.

    workspace:
      - src: fixtures/app.py
        dest: app.py

    graders:
      - type: deterministic
        run: bash graders/check.sh
        weight: 0.6

      - type: llm_rubric
        rubric: |
          Evaluate the security review quality:

          Detection (0-0.3):
          - Found SQL injection in list_users and create_user?
          - Found hardcoded secret_key?
          - Found eval() on user input in /calculate?
          - Found debug=True and host="0.0.0.0"?
          - Found arbitrary file write in /admin/config?

          Report Quality (0-0.4):
          - Follows the requested format (Title, Severity, Location, Description, Remediation)?
          - Severity ratings are reasonable?
          - Line numbers are accurate?
          - Remediations include actual corrected code, not just advice?

          Thoroughness (0-0.3):
          - No false positives (made-up vulnerabilities)?
          - Covers the most critical issues first?
          - Explanations include how an attacker would exploit each issue?
        weight: 0.4
